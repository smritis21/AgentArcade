      <text x="66" y="22" fill="#4de1c1" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">5 TASK TYPES</text>
      <rect x="146" width="108" height="34" rx="17" fill="#17243a" stroke="#b596ff" stroke-opacity=".55"/>
      <text x="200" y="22" fill="#c6a9ff" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">3 AGENTS</text>
      <rect x="268" width="106" height="34" rx="17" fill="#16253c" stroke="#65b4ff" stroke-opacity=".55"/>
      <text x="321" y="22" fill="#84c7ff" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">2 MODELS</text>
