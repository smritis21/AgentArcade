<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title description">
  <title id="title">BALROG Agentic LLM Experiments</title>
  <desc id="description">Inside the agent: one benchmark, three ways to act.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="1" stop-color="#172644"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de1c1"/>
      <stop offset="1" stop-color="#65b4ff"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#91acd0" stroke-opacity=".09"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>
  <rect width="1600" height="420" rx="26" fill="url(#background)"/>
  <rect width="1600" height="420" rx="26" fill="url(#grid)"/>
  <circle cx="1330" cy="200" r="154" fill="#4de1c1" opacity=".09" filter="url(#glow)"/>
  <path d="M1040 0h560v420h-560z" fill="#101a2e" opacity=".35"/>
  <g fill="none" stroke="#65b4ff" stroke-opacity=".28">
    <path d="M990 98h120l42 48h112"/>
    <path d="M990 210h160l44-40h110"/>
    <path d="M990 316h118l48-44h148"/>
    <path d="M1262 146v26m-26 20 26-20 27 20m-27 79v28"/>
  </g>
  <g>
    <rect x="958" y="77" width="64" height="42" rx="12" fill="#14253a" stroke="#4de1c1" stroke-opacity=".7"/>
    <rect x="958" y="189" width="64" height="42" rx="12" fill="#14253a" stroke="#b596ff" stroke-opacity=".8"/>
    <rect x="958" y="295" width="64" height="42" rx="12" fill="#14253a" stroke="#65b4ff" stroke-opacity=".8"/>
    <text x="990" y="104" fill="#4de1c1" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">ACT</text>
    <text x="990" y="216" fill="#c6a9ff" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">PLAN</text>
    <text x="990" y="322" fill="#84c7ff" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.2">REVIEW</text>
    <circle cx="1262" cy="146" r="10" fill="#4de1c1"/>
    <circle cx="1262" cy="172" r="8" fill="#65b4ff"/>
    <circle cx="1262" cy="252" r="10" fill="#b596ff"/>
    <rect x="1365" y="129" width="101" height="76" rx="16" fill="#14243a" stroke="#4de1c1" stroke-opacity=".6"/>
    <path d="m1396 166 15 13 27-32" fill="none" stroke="#4de1c1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1416" y="224" fill="#a0b0c7" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" letter-spacing="1.8">BABYAI</text>
  </g>
  <g transform="translate(78 72)">
    <g transform="translate(0 2)">
      <rect x="0" y="0" width="18" height="18" rx="5" fill="#4de1c1"/>
      <rect x="23" y="0" width="18" height="18" rx="5" fill="#65b4ff"/>
      <rect x="0" y="23" width="18" height="18" rx="5" fill="#65b4ff"/>
      <rect x="23" y="23" width="18" height="18" rx="5" fill="#b596ff"/>
    </g>
    <text x="58" y="31" fill="#e5edf9" font-family="Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="4">BALROG</text>
    <text x="245" y="30" fill="#a0b0c7" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.7">AGENTIC LLM EXPERIMENTS</text>
    <rect x="0" y="101" width="58" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="177" fill="#e5edf9" font-family="Arial,sans-serif" font-size="61" font-weight="800" letter-spacing="-2">Inside the agent.</text>
    <text x="2" y="223" fill="#c1cce0" font-family="Arial,sans-serif" font-size="21">One benchmark. Three ways to act.</text>
    <text x="2" y="255" fill="#a0b0c7" font-family="Arial,sans-serif" font-size="17">Explore the decisions behind baseline, planning, and reflection.</text>
    <g transform="translate(0 305)">
